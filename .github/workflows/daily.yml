name: Daily Morning Riddle & Inspiration Automation

on:
  schedule:
    # বাংলাদেশ সময় সকাল ৮:০০ টা (BST = UTC+6), অর্থাৎ UTC রাত ২:০০ টা
    - cron: '0 2 * * *'
  workflow_dispatch: # টেস্ট করার জন্য ম্যানুয়াল ট্রিগার

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Daily Morning Script
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT_NUMBER: ${{ secrets.WHATSAPP_RECIPIENT_NUMBER }}
        run: |
          python main.py
